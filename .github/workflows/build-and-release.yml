name: Build and Release ROI Agent PKG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.4)'
        required: false
        default: 'latest'

jobs:
  build-pkg:
    runs-on: macos-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          # Remove 'v' prefix
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
      
      - name: Install dependencies
        run: |
          cd agent && go mod download
          cd ../data-sender && go mod download
      
      - name: Build PKG (ARM64)
        run: |
          chmod +x scripts/build_pkg.sh
          ./scripts/build_pkg.sh ${{ steps.version.outputs.version }} arm64
      
      - name: Build PKG (x64)
        run: |
          ./scripts/build_pkg.sh ${{ steps.version.outputs.version }} x64
      
      - name: List built files
        run: |
          echo "📁 Built PKG files:"
          ls -lh build/pkg/
          echo ""
          echo "Checking specific files:"
          ls -lh build/pkg/ROI-Agent-macOS-arm64-${{ steps.version.outputs.version }}.pkg || echo "❌ ARM64 PKG not found"
          ls -lh build/pkg/ROI-Agent-macOS-x64-${{ steps.version.outputs.version }}.pkg || echo "❌ x64 PKG not found"
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Clean old files from Cloud Storage
        run: |
          BUCKET="gs://roi-agent-releases"
          echo "🗑️  Cleaning old files from latest/"
          gsutil -m rm -f ${BUCKET}/latest/macos/* 2>/dev/null || true
          echo "✅ Old files removed"
      
      - name: Upload to Cloud Storage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          BUILD_DIR="build/pkg"
          
          echo "☁️  Uploading PKG files to Cloud Storage..."
          echo "Version: ${VERSION}"
          echo "Build directory: ${BUILD_DIR}"
          echo ""
          
          # ARM64 PKG
          ARM64_PKG="${BUILD_DIR}/ROI-Agent-macOS-arm64-${VERSION}.pkg"
          ARM64_SHA="${BUILD_DIR}/ROI-Agent-macOS-arm64-${VERSION}.pkg.sha256"
          
          echo "Checking ARM64 files:"
          echo "  PKG: ${ARM64_PKG}"
          ls -lh "${ARM64_PKG}" || echo "  ❌ ARM64 PKG not found"
          echo "  SHA: ${ARM64_SHA}"
          ls -lh "${ARM64_SHA}" || echo "  ❌ ARM64 SHA not found"
          echo ""
          
          if [ -f "${ARM64_PKG}" ]; then
            echo "Uploading ARM64 PKG..."
            gsutil -h "Cache-Control:no-cache, max-age=0" cp "${ARM64_PKG}" "${BUCKET}/latest/macos/"
            echo "Uploading ARM64 SHA256..."
            gsutil -h "Cache-Control:no-cache, max-age=0" cp "${ARM64_SHA}" "${BUCKET}/latest/macos/"
            echo "✅ ARM64 PKG uploaded"
          else
            echo "❌ ARM64 PKG file not found: ${ARM64_PKG}"
            exit 1
          fi
          
          # x64 PKG
          X64_PKG="${BUILD_DIR}/ROI-Agent-macOS-x64-${VERSION}.pkg"
          X64_SHA="${BUILD_DIR}/ROI-Agent-macOS-x64-${VERSION}.pkg.sha256"
          
          echo ""
          echo "Checking x64 files:"
          echo "  PKG: ${X64_PKG}"
          ls -lh "${X64_PKG}" || echo "  ❌ x64 PKG not found"
          echo "  SHA: ${X64_SHA}"
          ls -lh "${X64_SHA}" || echo "  ❌ x64 SHA not found"
          echo ""
          
          if [ -f "${X64_PKG}" ]; then
            echo "Uploading x64 PKG..."
            gsutil -h "Cache-Control:no-cache, max-age=0" cp "${X64_PKG}" "${BUCKET}/latest/macos/"
            echo "Uploading x64 SHA256..."
            gsutil -h "Cache-Control:no-cache, max-age=0" cp "${X64_SHA}" "${BUCKET}/latest/macos/"
            echo "✅ x64 PKG uploaded"
          else
            echo "❌ x64 PKG file not found: ${X64_PKG}"
            exit 1
          fi
          
          # Version info
          echo ""
          echo "Creating version.json..."
          cat > version.json << EOF
          {
            "version": "${VERSION}",
            "release_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "format": "PKG",
            "platforms": {
              "macos": {
                "arm64": {
                  "file": "ROI-Agent-macOS-arm64-${VERSION}.pkg",
                  "sha256_file": "ROI-Agent-macOS-arm64-${VERSION}.pkg.sha256"
                },
                "x64": {
                  "file": "ROI-Agent-macOS-x64-${VERSION}.pkg",
                  "sha256_file": "ROI-Agent-macOS-x64-${VERSION}.pkg.sha256"
                }
              }
            }
          }
          EOF
          
          echo "Uploading version.json..."
          gsutil -h "Cache-Control:no-cache, max-age=0" cp version.json "${BUCKET}/latest/"
          
          echo ""
          echo "✅ All files uploaded successfully"
      
      - name: Verify upload
        run: |
          BUCKET="gs://roi-agent-releases"
          echo "📁 Uploaded files:"
          gsutil ls -lh "${BUCKET}/latest/macos/"
          echo ""
          gsutil ls -lh "${BUCKET}/latest/version.json"
          echo ""
          echo "✅ Upload verified"
      
      - name: Build Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "========================================" 
          echo "✅ ROI Agent PKG Build Complete!"
          echo "========================================"
          echo ""
          echo "Version: ${VERSION}"
          echo "Format: PKG (macOS Installer)"
          echo "Target: Background Service (LaunchAgent)"
          echo ""
          echo "Built packages:"
          ls -lh build/pkg/*.pkg 2>/dev/null || echo "No PKG files found"
          echo ""
          echo "SHA256 checksums:"
          cat build/pkg/*.sha256 2>/dev/null || echo "No SHA256 files found"
          echo ""
          echo "🎉 Ready for distribution"
