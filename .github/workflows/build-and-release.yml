name: Build and Upload ROI Agent Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.0)'
        required: false
        default: 'latest'

jobs:
  build-binaries:
    runs-on: macos-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
      
      - name: Install dependencies
        run: |
          cd agent && go mod download
          cd ../data-sender && go mod download
      
      - name: Build binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DIR="build/binaries"
          mkdir -p "$BUILD_DIR"
          
          echo "🔨 Building binaries..."
          
          # Agent - ARM64
          cd agent
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BUILD_DIR/roi-agent-arm64" main.go
          chmod +x "../$BUILD_DIR/roi-agent-arm64"
          
          # Agent - x64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BUILD_DIR/roi-agent-x64" main.go
          chmod +x "../$BUILD_DIR/roi-agent-x64"
          
          cd ..
          
          # Data Sender - ARM64
          cd data-sender
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BUILD_DIR/data-sender-arm64" .
          chmod +x "../$BUILD_DIR/data-sender-arm64"
          
          # Data Sender - x64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BUILD_DIR/data-sender-x64" .
          chmod +x "../$BUILD_DIR/data-sender-x64"
          
          cd ..
          
          echo "✅ All binaries built"
          ls -lh "$BUILD_DIR"
      
      - name: Create resources
        run: |
          RESOURCES_DIR="build/resources"
          mkdir -p "$RESOURCES_DIR"
          
          # LaunchAgent plist
          cat > "$RESOURCES_DIR/com.roiagent.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.roiagent</string>
              <key>ProgramArguments</key>
              <array>
                  <string>/Applications/ROI Agent/bin/roi-agent</string>
              </array>
              <key>RunAtLoad</key>
              <true/>
              <key>KeepAlive</key>
              <dict>
                  <key>SuccessfulExit</key>
                  <false/>
              </dict>
              <key>StandardOutPath</key>
              <string>/tmp/roiagent.stdout</string>
              <key>StandardErrorPath</key>
              <string>/tmp/roiagent.stderr</string>
              <key>WorkingDirectory</key>
              <string>/Applications/ROI Agent</string>
          </dict>
          </plist>
          EOF
          
          # README
          cat > "$RESOURCES_DIR/README.txt" << 'EOF'
          ROI Agent - macOS Background Service
          =====================================
          
          Pre-configured for your organization.
          Simply install and the agent starts automatically.
          
          NO CONFIGURATION NEEDED
          EOF
          
          # postinstall script template
          cat > "$RESOURCES_DIR/postinstall" << 'EOF'
          #!/bin/bash
          set -e
          
          CURRENT_USER=$(stat -f "%Su" /dev/console)
          USER_HOME=$(eval echo ~$CURRENT_USER)
          USER_ID=$(id -u "$CURRENT_USER")
          
          # Setup LaunchAgent
          LAUNCH_AGENTS_DIR="$USER_HOME/Library/LaunchAgents"
          mkdir -p "$LAUNCH_AGENTS_DIR"
          chown "$CURRENT_USER:staff" "$LAUNCH_AGENTS_DIR"
          
          PLIST_SRC="/Applications/ROI Agent/Resources/com.roiagent.plist"
          PLIST_DST="$LAUNCH_AGENTS_DIR/com.roiagent.plist"
          
          cp "$PLIST_SRC" "$PLIST_DST"
          chown "$CURRENT_USER:staff" "$PLIST_DST"
          chmod 644 "$PLIST_DST"
          
          # Create log directories
          LOG_DIR="$USER_HOME/.roiagent/logs"
          DATA_DIR="$USER_HOME/.roiagent/data"
          
          mkdir -p "$LOG_DIR" "$DATA_DIR"
          chown -R "$CURRENT_USER:staff" "$USER_HOME/.roiagent"
          
          # Load LaunchAgent
          sudo -u "$CURRENT_USER" launchctl bootstrap "gui/$USER_ID" "$PLIST_DST" 2>/dev/null || true
          sudo -u "$CURRENT_USER" launchctl enable "gui/$USER_ID/com.roiagent" 2>/dev/null || true
          sudo -u "$CURRENT_USER" launchctl kickstart -k "gui/$USER_ID/com.roiagent" 2>/dev/null || true
          
          echo "✅ ROI Agent installed and started!"
          exit 0
          EOF
          
          chmod +x "$RESOURCES_DIR/postinstall"
          
          echo "✅ Resources created"
      
      - name: Create version info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          cat > build/version.json << EOF
          {
            "version": "${VERSION}",
            "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "format": "binaries",
            "note": "Binaries are packaged dynamically on download"
          }
          EOF
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Upload to Cloud Storage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          
          echo "☁️  Uploading to Cloud Storage..."
          
          # Clean old files
          gsutil -m rm -rf ${BUCKET}/latest/ 2>/dev/null || true
          
          # Upload binaries
          gsutil cp build/binaries/* ${BUCKET}/latest/macos/binaries/
          
          # Upload resources
          gsutil cp -r build/resources ${BUCKET}/latest/macos/
          
          # Upload version info
          gsutil cp build/version.json ${BUCKET}/latest/
          
          echo "✅ Upload complete"
      
      - name: Verify upload
        run: |
          BUCKET="gs://roi-agent-releases"
          echo "📁 Uploaded files:"
          gsutil ls -lh "${BUCKET}/latest/macos/binaries/"
          gsutil ls -lh "${BUCKET}/latest/macos/resources/"
          echo ""
          echo "✅ Verification complete"
