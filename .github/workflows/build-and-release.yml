name: Build and Upload ROI Agent Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.0)'
        required: false
        default: 'latest'

jobs:
  build-binaries:
    runs-on: macos-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
      
      - name: Install dependencies
        run: |
          cd agent && go mod download
          cd ../data-sender && go mod download
      
      - name: Build binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DIR="build/binaries"
          mkdir -p "$BUILD_DIR"
          
          echo "🔨 Building binaries..."
          
          # Agent - ARM64
          cd agent
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BUILD_DIR/roi-agent-arm64" main.go
          chmod +x "../$BUILD_DIR/roi-agent-arm64"
          
          # Agent - x64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BUILD_DIR/roi-agent-x64" main.go
          chmod +x "../$BUILD_DIR/roi-agent-x64"
          
          cd ..
          
          # Data Sender - ARM64
          cd data-sender
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BUILD_DIR/data-sender-arm64" .
          chmod +x "../$BUILD_DIR/data-sender-arm64"
          
          # Data Sender - x64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BUILD_DIR/data-sender-x64" .
          chmod +x "../$BUILD_DIR/data-sender-x64"
          
          cd ..
          
          echo "✅ All binaries built"
          ls -lh "$BUILD_DIR"
      
      - name: Create PKG templates
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # ARM64 PKG
          ./scripts/build_pkg.sh $VERSION arm64
          
          # x64 PKG
          ./scripts/build_pkg.sh $VERSION x64
          
          echo "✅ PKG templates created"
      
      - name: Create version info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          cat > build/version.json << EOF
          {
            "version": "${VERSION}",
            "build_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "format": "pkg_template"
          }
          EOF
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Upload to Cloud Storage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          
          echo "☁️  Uploading to Cloud Storage..."
          
          # Clean old files
          gsutil -m rm -rf ${BUCKET}/latest/ 2>/dev/null || true
          
          # Upload PKG templates
          gsutil cp build/pkg/ROI-Agent-macOS-arm64-${VERSION}.pkg ${BUCKET}/latest/macos/templates/
          gsutil cp build/pkg/ROI-Agent-macOS-x64-${VERSION}.pkg ${BUCKET}/latest/macos/templates/
          
          # Upload SHA256
          gsutil cp build/pkg/ROI-Agent-macOS-arm64-${VERSION}.pkg.sha256 ${BUCKET}/latest/macos/templates/
          gsutil cp build/pkg/ROI-Agent-macOS-x64-${VERSION}.pkg.sha256 ${BUCKET}/latest/macos/templates/
          
          # Upload version info
          gsutil cp build/version.json ${BUCKET}/latest/
          
          echo "✅ Upload complete"
      
      - name: Verify upload
        run: |
          BUCKET="gs://roi-agent-releases"
          echo "📁 Uploaded files:"
          gsutil ls -lh "${BUCKET}/latest/macos/templates/"
          echo ""
          echo "✅ Verification complete"
