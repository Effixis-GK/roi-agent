name: Build and Release ROI Agent

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: false
        default: 'latest'

jobs:
  build-and-upload:
    runs-on: macos-latest  # macOSに変更（sips, iconutil使用のため）
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
      
      - name: Install dependencies
        run: |
          cd agent
          go mod download
          cd ../data-sender
          go mod download
          echo "✅ Go dependencies downloaded"
      
      # 1. Agent バイナリのビルド
      - name: Build Agent (Intel)
        run: |
          cd agent
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../build/roi-agent-intel main.go
          chmod +x ../build/roi-agent-intel
          echo "✅ Agent Intel: $(du -h ../build/roi-agent-intel | cut -f1)"
      
      - name: Build Agent (ARM64)
        run: |
          cd agent
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../build/roi-agent-arm64 main.go
          chmod +x ../build/roi-agent-arm64
          echo "✅ Agent ARM64: $(du -h ../build/roi-agent-arm64 | cut -f1)"
      
      # 2. Data Sender バイナリのビルド
      - name: Build Data Sender (Intel)
        run: |
          cd data-sender
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../build/data-sender-intel main.go config.go logger.go processor.go sender.go types.go utils.go
          chmod +x ../build/data-sender-intel
          echo "✅ Data Sender Intel: $(du -h ../build/data-sender-intel | cut -f1)"
      
      - name: Build Data Sender (ARM64)
        run: |
          cd data-sender
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../build/data-sender-arm64 main.go config.go logger.go processor.go sender.go types.go utils.go
          chmod +x ../build/data-sender-arm64
          echo "✅ Data Sender ARM64: $(du -h ../build/data-sender-arm64 | cut -f1)"
      
      # 3. Windows版（オプション）
      - name: Build Windows (optional)
        run: |
          cd agent
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../build/roi-agent.exe main.go
          echo "✅ Windows: $(du -h ../build/roi-agent.exe | cut -f1)"
      
      # 4. リソースのZIP化
      - name: Create Web UI archive
        run: |
          cd web
          zip -r ../build/web.zip . -x "*.pyc" -x "__pycache__/*" -x ".DS_Store"
          echo "✅ Web UI: $(du -h ../build/web.zip | cut -f1)"
      
      - name: Create Scripts archive
        run: |
          cd scripts
          zip -r ../build/scripts.zip . -x ".DS_Store"
          echo "✅ Scripts: $(du -h ../build/scripts.zip | cut -f1)"
      
      # 5. AppIcon.icns作成（macOS-latest上で実行）
      - name: Create AppIcon.icns
        run: |
          if [ -f "public/icon.png" ]; then
            ICONSET_DIR="build/AppIcon.iconset"
            mkdir -p "$ICONSET_DIR"
            
            echo "Creating iconset..."
            sips -z 16 16 public/icon.png --out "$ICONSET_DIR/icon_16x16.png"
            sips -z 32 32 public/icon.png --out "$ICONSET_DIR/icon_16x16@2x.png"
            sips -z 32 32 public/icon.png --out "$ICONSET_DIR/icon_32x32.png"
            sips -z 64 64 public/icon.png --out "$ICONSET_DIR/icon_32x32@2x.png"
            sips -z 128 128 public/icon.png --out "$ICONSET_DIR/icon_128x128.png"
            sips -z 256 256 public/icon.png --out "$ICONSET_DIR/icon_128x128@2x.png"
            sips -z 256 256 public/icon.png --out "$ICONSET_DIR/icon_256x256.png"
            sips -z 512 512 public/icon.png --out "$ICONSET_DIR/icon_256x256@2x.png"
            sips -z 512 512 public/icon.png --out "$ICONSET_DIR/icon_512x512.png"
            sips -z 1024 1024 public/icon.png --out "$ICONSET_DIR/icon_512x512@2x.png"
            
            iconutil -c icns "$ICONSET_DIR" -o "build/AppIcon.icns"
            rm -rf "$ICONSET_DIR"
            
            echo "✅ AppIcon.icns: $(du -h build/AppIcon.icns | cut -f1)"
          else
            echo "⚠️  icon.png not found"
          fi
      
      # 6. version.json作成
      - name: Create version.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          cat > build/version.json << EOF
          {
            "version": "${VERSION}",
            "release_date": "${BUILD_DATE}",
            "commit": "${COMMIT_SHA}",
            "changelog": "Complete .app bundle with AppIcon, Web UI, and launcher",
            "features": [
              "Application monitoring",
              "DNS/Network monitoring",
              "Web dashboard (localhost:5002)",
              "Data transmission (10min interval)",
              "Organization-specific API key"
            ],
            "platforms": {
              "macos": {
                "architectures": ["amd64", "arm64"],
                "requires_accessibility": true,
                "requires_sudo": true,
                "icon_support": true
              },
              "windows": {
                "architectures": ["amd64"]
              }
            }
          }
          EOF
          
          echo "✅ version.json created"
          cat build/version.json
      
      # 7. Cloud Storage認証
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      # 8. 古いファイルを削除（コスト削減）
      - name: Clean old files from Cloud Storage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          
          echo "🗑️  Cleaning old files for version: ${VERSION}"
          
          # latestディレクトリのみをクリーンアップ（バージョン付きは残す）
          if [ "$VERSION" == "latest" ]; then
            gsutil -m rm -f ${BUCKET}/latest/macos/* 2>/dev/null || true
            gsutil -m rm -f ${BUCKET}/latest/macos/resources/* 2>/dev/null || true
            gsutil -m rm -f ${BUCKET}/latest/windows/* 2>/dev/null || true
            echo "✅ Old 'latest' files removed"
          fi
      
      # 9. Cloud Storageへアップロード
      - name: Upload to Cloud Storage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          
          echo "☁️  Uploading to ${BUCKET}/${VERSION}/"
          
          # Binaries
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/roi-agent-intel ${BUCKET}/${VERSION}/macos/
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/roi-agent-arm64 ${BUCKET}/${VERSION}/macos/
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/data-sender-intel ${BUCKET}/${VERSION}/macos/
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/data-sender-arm64 ${BUCKET}/${VERSION}/macos/
          
          # Windows (optional)
          if [ -f "build/roi-agent.exe" ]; then
            gsutil -h "Cache-Control:no-cache, max-age=0" cp build/roi-agent.exe ${BUCKET}/${VERSION}/windows/
          fi
          
          # Resources
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/web.zip ${BUCKET}/${VERSION}/macos/resources/
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/scripts.zip ${BUCKET}/${VERSION}/macos/resources/
          
          # Icon files
          if [ -f "public/icon.png" ]; then
            gsutil -h "Cache-Control:no-cache, max-age=0" cp public/icon.png ${BUCKET}/${VERSION}/macos/resources/
          fi
          
          if [ -f "build/AppIcon.icns" ]; then
            gsutil -h "Cache-Control:no-cache, max-age=0" cp build/AppIcon.icns ${BUCKET}/${VERSION}/macos/resources/
          fi
          
          # version.json
          gsutil -h "Cache-Control:no-cache, max-age=0" cp build/version.json ${BUCKET}/${VERSION}/
          
          echo "✅ All files uploaded successfully"
      
      # 10. 検証
      - name: Verify upload
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          
          echo "📁 Uploaded files:"
          gsutil ls -lh ${BUCKET}/${VERSION}/
          gsutil ls -lh ${BUCKET}/${VERSION}/macos/
          gsutil ls -lh ${BUCKET}/${VERSION}/macos/resources/
          
          echo ""
          echo "✅ Upload verified"
      
      # 11. サマリー
      - name: Build Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "========================================"
          echo "✅ ROI Agent Build Complete!"
          echo "========================================"
          echo ""
          echo "Version: ${VERSION}"
          echo "Commit: $(git rev-parse --short HEAD)"
          echo ""
          echo "📦 Built files:"
          ls -lh build/
          echo ""
          echo "☁️  Cloud Storage: gs://roi-agent-releases/${VERSION}/"
          echo ""
          echo "🎉 Ready for download via ROI Dashboard"
