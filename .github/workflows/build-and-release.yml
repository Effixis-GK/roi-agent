name: Build and Upload ROI Agent PKG

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.2.0)'
        required: false
        default: 'latest'

jobs:
  build-and-upload:
    runs-on: macos-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: |
            data-sender/go.sum
            windows/go.sum
      
      - name: Extract version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="latest"
          fi
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
      
      - name: Install dependencies
        run: |
          cd agent && go mod download
          cd ../data-sender && go mod download
      
      - name: Build binaries
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DIR="build/binaries"
          mkdir -p "$BUILD_DIR"
          
          echo "🔨 Building binaries..."
          
          # Agent - ARM64
          cd agent
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BUILD_DIR/roi-agent-arm64" main.go
          chmod +x "../$BUILD_DIR/roi-agent-arm64"
          
          # Agent - x64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BUILD_DIR/roi-agent-x64" main.go
          chmod +x "../$BUILD_DIR/roi-agent-x64"
          
          cd ..
          
          # Data Sender - ARM64
          cd data-sender
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o "../$BUILD_DIR/data-sender-arm64" .
          chmod +x "../$BUILD_DIR/data-sender-arm64"
          
          # Data Sender - x64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o "../$BUILD_DIR/data-sender-x64" .
          chmod +x "../$BUILD_DIR/data-sender-x64"
          
          cd ..
          
          echo "✅ All binaries built"
          ls -lh "$BUILD_DIR"
      
      - name: Build PKG files (Latest, no version suffix)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "📦 Building PKG files..."
          
          # Make build script executable
          chmod +x scripts/build_pkg.sh
          
          # Build ARM64 PKG
          ./scripts/build_pkg.sh $VERSION arm64
          
          # Build x64 PKG
          ./scripts/build_pkg.sh $VERSION x64
          
          echo "✅ PKG files created"
          ls -lh build/pkg/
      
      - name: Create version info
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=$(git rev-parse --short HEAD)
          
          cat > build/version.json << EOF
          {
            "version": "${VERSION}",
            "build_date": "${BUILD_DATE}",
            "commit": "${COMMIT_SHA}",
            "format": "LATEST_PKG",
            "requires_configuration": true,
            "distribution_method": "authenticated_api"
          }
          EOF
          
          cat build/version.json
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Upload to Cloud Storage (Latest only)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUCKET="gs://roi-agent-releases"
          
          echo "☁️  Uploading to Cloud Storage (Latest only)..."
          
          # Upload PKG files without version suffix
          echo "Uploading ARM64 PKG..."
          gsutil cp build/pkg/ROI-Agent-macOS-arm64-${VERSION}.pkg \
            ${BUCKET}/latest/macos/ROI-Agent-macOS-arm64.pkg
          
          echo "Uploading x64 PKG..."
          gsutil cp build/pkg/ROI-Agent-macOS-x64-${VERSION}.pkg \
            ${BUCKET}/latest/macos/ROI-Agent-macOS-x64.pkg
          
          # Upload SHA256 checksums without version suffix
          echo "Uploading checksums..."
          gsutil cp build/pkg/ROI-Agent-macOS-arm64-${VERSION}.pkg.sha256 \
            ${BUCKET}/latest/macos/ROI-Agent-macOS-arm64.pkg.sha256
          
          gsutil cp build/pkg/ROI-Agent-macOS-x64-${VERSION}.pkg.sha256 \
            ${BUCKET}/latest/macos/ROI-Agent-macOS-x64.pkg.sha256
          
          # Upload version info
          echo "Uploading version info..."
          gsutil cp build/version.json ${BUCKET}/latest/version.json
          
          # Set content types
          gsutil setmeta -h "Content-Type:application/octet-stream" \
            ${BUCKET}/latest/macos/*.pkg
          
          gsutil setmeta -h "Content-Type:text/plain" \
            ${BUCKET}/latest/macos/*.sha256
          
          gsutil setmeta -h "Content-Type:application/json" \
            ${BUCKET}/latest/version.json
          
          # Set cache control (no caching for latest)
          gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" \
            ${BUCKET}/latest/macos/*.pkg
          
          gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" \
            ${BUCKET}/latest/version.json
          
          echo "✅ Upload complete"
      
      - name: Verify upload
        run: |
          BUCKET="gs://roi-agent-releases"
          echo "📁 Uploaded files:"
          echo ""
          echo "PKG Files:"
          gsutil ls -lh "${BUCKET}/latest/macos/"
          echo ""
          echo "Version Info:"
          gsutil cat "${BUCKET}/latest/version.json"
          echo ""
          echo "✅ Verification complete"
      
      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## 🎉 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts (Latest)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`ROI-Agent-macOS-arm64.pkg\` (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ROI-Agent-macOS-x64.pkg\` (Intel)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ☁️ Cloud Storage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files uploaded to: \`gs://roi-agent-releases/latest/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Distribution" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PKG files are distributed via **Dashboard API** with API key authentication" >> $GITHUB_STEP_SUMMARY
          echo "Always serves the **latest version** without version numbers in filenames" >> $GITHUB_STEP_SUMMARY
